---
# Inventaire Ansible — MSPR NordTransit Lab
# Changer ansible_host selon le Proxmox cible (pve02 perso ou ecole)

all:
  children:
    proxmox:
      hosts:
        pve02:
          ansible_host: "192.168.1.100"    # TODO: mettre l'IP reelle de pve02
          ansible_user: root
          ansible_connection: ssh

        # Decommenter pour utiliser le Proxmox de l'ecole :
        # pve-ecole:
        #   ansible_host: "10.x.x.x"      # IP du Proxmox ecole
        #   ansible_user: root
        #   ansible_connection: ssh

    # Hosts du lab (accessibles apres creation des VMs)
    lab_linux:
      hosts:
        wms:
          ansible_host: 172.16.132.20
          ansible_user: wmsadmin
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_connection: ssh
